name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Rust contracts ───────────────────────────────────────────────────────────
  contracts:
    name: Contracts (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Run contract tests
        run: cargo test

      - name: Build contracts to WASM
        run: cargo build --target wasm32-unknown-unknown --release

  # ── TypeScript SDK ───────────────────────────────────────────────────────────
  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install
        working-directory: sdk

      - name: Run SDK tests
        run: pnpm test
        working-directory: sdk

      - name: Type check SDK
        run: pnpm exec tsc --noEmit
        working-directory: sdk

      - name: Build SDK and import it from plain Node
        # Vite and Vitest resolve extensionless ESM imports; plain Node does
        # not. This catches a built SDK that only works through a bundler.
        run: pnpm run build && node -e "import('./dist/index.js')"
        working-directory: sdk

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install
        working-directory: backend

      - name: Run backend tests
        run: pnpm test
        working-directory: backend

      - name: Type check backend
        run: pnpm exec tsc --noEmit
        working-directory: backend

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Build sdk
        # frontend depends on @starbound-realms/sdk as a workspace package;
        # its dist/ is gitignored, so it must be built before frontend's own
        # type check or build can resolve it.
        run: pnpm run build
        working-directory: sdk

      - name: Run frontend tests with coverage
        run: pnpm test
        working-directory: frontend

      - name: Type check frontend
        run: pnpm exec tsc --noEmit
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend
